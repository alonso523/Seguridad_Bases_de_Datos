{% extends "base.html" %}

{% block title %}Editar Transacción - FinanzasPro{% endblock %}

{% block content %}
<div class="form-container" style="max-width: 600px; margin: 0 auto; animation: slideDown 0.6s ease-out;">
    <div style="margin-bottom: 2rem; text-align: center;">
        <h2 style="font-size: 2rem; color: var(--text-primary);">Editar Transacción</h2>
        <p style="color: var(--text-secondary);">Modifica los detalles de la transacción seleccionada.</p>
    </div>

    <div class="form-card">
        <form method="post">
            <div class="form-group">
                <label for="descripcion">Descripción</label>
                <input type="text" id="descripcion" name="descripcion" value="{{ t.descripcion }}" required>
            </div>

            <div class="form-group">
                <label for="monto">Monto (USD)</label>
                <div style="position: relative;">
                    <span style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-secondary);">$</span>
                    <input type="number" id="monto" step="0.01" name="monto" value="{{ t.monto }}" style="padding-left: 2rem;" required>
                </div>
            </div>

            <div style="display: flex; gap: 1rem; margin-top: 2rem;">
                <button type="submit" class="btn btn-primary" style="flex: 2; justify-content: center;">
                    💾 Guardar Cambios
                </button>
                <a href="/transacciones" class="btn btn-outline" style="flex: 1; justify-content: center;">
                    Cancelar
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
