<!DOCTYPE html>
<html>
<head><title>Editar Transacción</title></head>
<body>
    <h1>Editar Transacción</h1>

    <form method="post">
        <label>Monto:</label>
        <input type="number" step="0.01" name="monto" value="{{ t.monto }}" required>

        <label>Descripción:</label>
        <input type="text" name="descripcion" value="{{ t.descripcion }}" required>

        <button type="submit">Actualizar</button>
    </form>

    <a href="/transacciones">Volver</a>
</body>
</html>
